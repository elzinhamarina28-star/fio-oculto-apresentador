name: Fio Oculto Live checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: ESLint
        run: bun run lint
      - name: Prettier formatting check (existing repository formatting debt)
        run: bun run format:check
        continue-on-error: true
      - name: Production build
        run: bun run build
